[project]
name = "audit_manifest"
version = "2.0.0"
description = "Static triage of AndroidManifest.xml"
authors = [{ name = "Carter", email = "carter@opsec.local" }]
requires-python = ">=3.11"
dependencies = [
    "lxml>=4.9.3",
    "click>=8.1.7",
    "rich>=13.5.2",
]
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
audit_manifest = "audit_manifest:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
