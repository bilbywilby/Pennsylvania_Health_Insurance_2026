name: python-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: lint (syntax errors and undefined names only)
        run: python -m ruff check --select E9,F63,F7,F82 sources/pa_health_audits/src sources/pa_health_audits/tests tests
      - name: repo tests
        run: python -m pytest -q tests
      - name: install pa_health_audits (best effort)
        working-directory: sources/pa_health_audits
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            python -m pip install -e . || echo "::warning::editable install failed; falling back to PYTHONPATH"
          fi
      - name: pa_health_audits tests
        working-directory: sources/pa_health_audits
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
